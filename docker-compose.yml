version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: orari-polisportiva-db
    environment:
      POSTGRES_DB: orari_polisportiva
      POSTGRES_USER: polisportiva
      POSTGRES_PASSWORD: polisportiva_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polisportiva"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orari-polisportiva-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orari_polisportiva
      SPRING_DATASOURCE_USERNAME: polisportiva
      SPRING_DATASOURCE_PASSWORD: polisportiva_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/palestre"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orari-polisportiva-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8080/api

volumes:
  postgres_data:

networks:
  default:
    name: orari-polisportiva-network
